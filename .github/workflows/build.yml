name: Build BaoGiaApp (Windows + macOS)

# Chay tu dong moi khi push len nhanh main, HOAC bam nut "Run workflow" thu cong trong tab Actions.
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller BaoGia_win.spec

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: BaoGiaApp-Windows
          path: dist/Phan mem Bao gia - ITD Viet Nam/

  build-macos:
    name: Build macOS (.app)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with py2app
        run: python3 setup_mac.py py2app

      - name: Zip the .app (giu nguyen quyen thuc thi + cau truc bundle)
        run: |
          cd dist
          zip -r -y "BaoGiaApp-macOS.zip" "Phan mem Bao gia - ITD Viet Nam.app"

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: BaoGiaApp-macOS
          path: dist/BaoGiaApp-macOS.zip
